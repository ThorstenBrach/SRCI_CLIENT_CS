name: "🕷️ Bug report"
description: "Report errors or unexpected behavior."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please make sure to [search for existing issues](https://github.com/ThorstenBrach/SRCI_CLIENT_CS/issues?q=is%3Aissue) before filing a new one!
        For a security problem (e.g. a robot that moves unexpectedly) do **not** open a public issue - use
        "Report a security problem" on the previous page.
  - type: markdown
    attributes:
      value: |
        ## About the item
  - type: input
    id: item_name
    attributes:
      label: "Name"
      description: "Class or method"
      placeholder: "e.g. RobotTask.Execute"
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: "Package version"
      description: "NuGet package version or commit"
      placeholder: "e.g. 0.1.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: ".NET version and operating system"
      placeholder: "e.g. .NET 8 on Windows 11"
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ## About the bug
  - type: textarea
    id: current
    attributes:
      label: "Current behavior"
      description: "A concise description of what you're experiencing. Include error / warning IDs (e.g. 16#8C04)."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      description: "What did you expect? A reference to the SRCI specification (chapter / table) helps."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: false
  - type: textarea
    id: robot
    attributes:
      label: "Robot controller"
      description: "Robot, firmware and SRCI version, or simulator used."
      placeholder: "e.g. JAKA MiniCobo, firmware 3.3.15, SRCI 1.1"
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ## Solution
  - type: textarea
    id: solution
    attributes:
      label: "Proposed solution"
      description: "Tell us if you already have an idea how this can be fixed."
      placeholder: |
        ```csharp
        counter += 1; // 11 changed to 1
        ```
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ## Log data
  - type: textarea
    id: logs
    attributes:
      label: "Relevant log output"
      description: "Message log, client log or captured telegrams. This will be formatted as code automatically."
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: confidential
    attributes:
      label: "Confidential content"
      options:
        - label: "The issue contains no confidential documents, passwords or IP addresses of production systems."
          required: true
